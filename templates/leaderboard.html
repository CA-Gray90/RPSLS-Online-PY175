{% extends 'layout.html' %}

{% block title %}
<title>Leaderboard</title>
{% endblock %}

{% block content %}
<h1>Leaderboard</h1>

<table>
  <tr>
    <th>Player Name</th>
    <th>Score</th>
  </tr>
  {% for player in leaderboard %}
  <tr>
    <td>{{ player[0] }}</td>
    <td>{{ player[1] }}</td>
  </tr>
  {% endfor %}
</table>
<br>
<a href="{{ url_for('home') }}">Home</a>
{% endblock %}
