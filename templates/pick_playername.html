{% extends 'layout.html' %}

{% block title %}
<title>Pick a username</title>
{% endblock %}


{% block content %}
{% with messages = get_flashed_messages() %}
  {% if messages %}
  <ul>
    {% for message in messages %}
    <li>{{ message }}</li>
    {% endfor %}
  </ul>
  {% endif %}
{% endwith %}
<h2>Pick your player name!</h2>
<form action="{{ url_for('validate_playername') }} " method="POST">
  <label for="player_name">Enter Player name (Max {{ max_playername_length }} Characters):</label>
  <input id="player_name" type="text" name="player_name" maxlength="{{ max_playername_length }}" size="{{ max_playername_length - 2 }}" value="{{ current_name }}">
  <input type="submit" value="Submit">
</form>
{% endblock %}
